<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>VELTRIX - AI Bot Builder</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2, h3 { color: #38bdf8; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }
        button { background: #38bdf8; color: #0f172a; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        .section { margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>VELTRIX AI Bot Builder</h2>
    
    <!-- AI Orqali Bot Yaratish -->
    <div>
        <h3>AI Yordamida Bot Yaratish</h3>
        <input type="text" id="aiToken" placeholder="Telegram Bot Tokeningiz (BotFather'dan)">
        <textarea id="aiPrompt" rows="4" placeholder="Bot qanday ish qilsin? Masalan: Mini App ochadigan tugmasi bo'lsin va ob-havoni ko'rsatsin..."></textarea>
        <button onclick="generateAIBot()">AI orqali Yaratish va Ishga tushirish</button>
    </div>

    <!-- Shaxsiy Kod Kiritish Bo'limi -->
    <div class="section">
        <h3>Shaxsiy Kod Orqali Ishga tushirish</h3>
        <input type="text" id="customToken" placeholder="Telegram Bot Tokeningiz">
        <textarea id="customCode" rows="6" placeholder="Python kodingizni shu yerga yozing..."></textarea>
        <button onclick="runCustomBot()">Kodni Ishga tushirish</button>
    </div>

    <div id="status"></div>
</div>

<script>
    const BACKEND_URL = "https://sizning-render-serveringiz.onrender.com"; // Renderdagi URL manzilingizni yozing

    async function generateAIBot() {
        const token = document.getElementById('aiToken').value;
        const prompt = document.getElementById('aiPrompt').value;
        const status = document.getElementById('status');

        status.style.color = "#38bdf8";
        status.innerText = "Bot generatsiya qilinmoqda va ishga tushirilmoqda, iltimos kuting...";

        try {
            let response = await fetch(`${BACKEND_URL}/api/generate-bot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, prompt })
            });
            let result = await response.json();
            
            if (response.ok) {
                status.style.color = "#4ade80";
                status.innerText = result.message;
            } else {
                status.style.color = "#f87171";
                status.innerText = "Xatolik: " + result.error;
            }
        } catch (err) {
            status.style.color = "#f87171";
            status.innerText = "Server bilan aloqa o'rnatib bo'lmadi: " + err;
        }
    }

    async function runCustomBot() {
        const token = document.getElementById('customToken').value;
        const code = document.getElementById('customCode').value;
        const status = document.getElementById('status');

        status.style.color = "#38bdf8";
        status.innerText = "Kod tekshirilmoqda va bot ishga tushirilmoqda...";

        try {
            let response = await fetch(`${BACKEND_URL}/api/run-custom-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, code })
            });
            let result = await response.json();
            
            if (response.ok) {
                status.style.color = "#4ade80";
                status.innerText = result.message;
            } else {
                status.style.color = "#f87171";
                status.innerText = "Xatolik: " + result.error;
            }
        } catch (err) {
            status.style.color = "#f87171";
            status.innerText = "Server bilan aloqa o'rnatib bo'lmadi: " + err;
        }
    }
</script>

</body>
</html>
