<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELTRIX - AI App & Bot Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">V</div>
            <span class="text-xl font-bold tracking-tight text-gray-900">VELTRIX</span>
        </div>
        <div class="flex items-center space-x-4">
            <button class="text-gray-600 hover:text-gray-900 font-medium">Products</button>
            <button class="text-gray-600 hover:text-gray-900 font-medium">Pricing</button>
            <button class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Log in</button>
            <button class="px-4 py-2 text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 rounded-lg">Create account</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center flex-grow px-4 py-12 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-gray-900 mb-4">What will you build?</h1>
        <p class="text-gray-500 mb-8 text-lg">Turn ideas into apps in minutes — no coding needed</p>

        <!-- Prompt Box -->
        <div class="w-full max-w-2xl bg-white border border-gray-300 rounded-2xl shadow-sm p-3 relative flex flex-col">
            <textarea id="promptInput" rows="3" class="w-full outline-none resize-none text-gray-800 placeholder-gray-400 p-2 text-base" placeholder="Make a Telegram Bot or Mini App for..."></textarea>
            
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                <div class="flex items-center space-x-2">
                    <label class="cursor-pointer p-2 hover:bg-gray-100 rounded-full text-gray-500 transition" title="Rasm yoki Fayl yuklash">
                        ➕ <input type="file" id="fileInput" class="hidden" accept="image/*">
                    </label>
                </div>
                <button onclick="deployBot()" class="bg-orange-600 hover:bg-orange-700 text-white p-2.5 rounded-xl transition flex items-center justify-center">
                    ➔
                </button>
            </div>
        </div>

        <!-- Quick Templates -->
        <div class="flex flex-wrap justify-center gap-3 mt-6">
            <button onclick="setPrompt('Hamster Kombat style clicker game mini app')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-xs">🐹 Hamster Kombat App</button>
            <button onclick="setPrompt('TikTok style video feed mini app')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-xs">📱 TikTok Feed</button>
            <button onclick="setPrompt('E-Commerce online store telegram bot')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-xs">🛒 E-Commerce Bot</button>
            <button onclick="setPrompt('Advanced AI Assistant bot')" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-xs">🤖 AI Assistant</button>
        </div>

        <!-- Result / Preview Area -->
        <div id="resultArea" class="mt-8 hidden w-full max-w-2xl bg-white border border-gray-200 rounded-xl p-6 text-left shadow-md">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Natija:</h3>
            <p id="statusText" class="text-gray-600 mb-4">Tayyorlanmoqda...</p>
            <div id="actionButtons" class="flex gap-4">
                <a id="appLink" href="#" target="_blank" class="hidden px-4 py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700">👁️ Preview (Ko'rish)</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-400 text-sm border-t border-gray-200">
        © 2026 VELTRIX Engine Platform. Powered by Gemini AI.
    </footer>

    <script>
        function setPrompt(text) {
            document.getElementById('promptInput').value = text;
        }

        async function deployBot() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert("Iltimos, buyruq kiriting!");
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const appLink = document.getElementById('appLink');

            resultArea.classList.remove('hidden');
            statusText.innerText = "VELTRIX AI sizning so'rovingiz asosida yaratmoqda...";
            appLink.classList.add('hidden');

            try {
                const response = await fetch('https://mini-replit.onrender.com/deploy-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: "DEMO_TOKEN_" + Date.now(), prompt: prompt, email: "user@veltrix.ai" })
                });

                const data = await response.json();
                if (data.status === 'success') {
                    statusText.innerText = data.message;
                    appLink.href = data.app_url;
                    appLink.classList.remove('hidden');
                } else {
                    statusText.innerText = "Xatolik: " + (data.error || "Noma'lum xato");
                }
            } else {
                statusText.innerText = "Server bilan aloqada xatolik yuz berdi.";
            }
        }
    </script>
</body>
</html>
