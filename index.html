<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akmal AI Studio — Next-Gen Bot Builder</title>
    <style>
        :root {
            --bg-dark: #08090c;
            --panel-bg: #12151e;
            --border-color: #23283b;
            --accent-blue: #0070f3;
            --accent-purple: #7928ca;
            --accent-green: #50e3c2;
            --text-main: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 800; background: linear-gradient(90deg, #0070f3, #7928ca); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
        .badge { background: rgba(80, 227, 194, 0.1); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }

        .main-layout { display: flex; flex: 1; height: calc(100vh - 61px); }

        /* Left AI Prompt Section */
        .ai-sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .ai-sidebar h3 { font-size: 0.9rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.8rem; color: #aaa; }
        .input-group input, .input-group textarea { background: #08090c; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: white; font-size: 0.85rem; outline: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--accent-blue); }

        .btn-generate { background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Center Editor Section */
        .editor-section { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .editor-header { background: #0c0e14; padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .file-tab { background: var(--panel-bg); color: var(--accent-blue); padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; border: 1px solid var(--border-color); font-weight: 600; }
        .code-area { flex: 1; background: #08090c; color: #e1e4e8; border: none; padding: 20px; font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.6; outline: none; resize: none; }

        /* Right Terminal Section */
        .terminal-section { width: 380px; background: #050608; display: flex; flex-direction: column; }
        .terminal-header { background: var(--panel-bg); padding: 10px 15px; border-bottom: 1px solid var(--border-color); font-size: 0.8rem; color: #888; display: flex; justify-content: space-between; }
        .terminal-logs { flex: 1; padding: 15px; font-family: monospace; font-size: 0.85rem; color: var(--accent-green); overflow-y: auto; white-space: pre-wrap; }
        
        .btn-run { background: #10b981; color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-run:hover { background: #059669; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡️ AKMAL AI STUDIO <span class="badge">7X CHEAP & 2X FASTER</span></div>
        <button class="btn-run" onclick="runCode()">▶️ Botni Ishga Tushirish</button>
    </header>

    <div class="main-layout">
        <!-- AI Bot Creator Sidebar -->
        <div class="ai-sidebar">
            <h3>🤖 AI Bot Yaratuvchi</h3>
            <div class="input-group">
                <label>Telegram Bot Token:</label>
                <input type="text" id="bot-token" placeholder="123456789:AAH...">
            </div>
            <div class="input-group">
                <label>Bot vazifasini ta'riflang:</label>
                <textarea id="bot-prompt" rows="6" placeholder="Masalan: Menga valyuta kurslarini ko'rsatadigan bot yaratib ber..."></textarea>
            </div>
            <button class="btn-generate" onclick="generateBot()">✨ Botni Avtomatik Yaratish</button>
        </div>

        <!-- Editor -->
        <div class="editor-section">
            <div class="editor-header">
                <div class="file-tab">📄 main.py</div>
                <span style="font-size: 0.8rem; color: #666;">Auto-Saved</span>
            </div>
            <textarea id="editor" class="code-area" spellcheck="false"># Bu yerda AI yaratgan bot kodi paydo bo'ladi...
# Chap tomondagi paneldan bot vazifasini yozing va tugmani bosing!</textarea>
        </div>

        <!-- Terminal -->
        <div class="terminal-section">
            <div class="terminal-header">
                <span>💻 LIVE CONSOLE LOGS</span>
                <span id="status" style="color: #10b981;">STANDBY</span>
            </div>
            <div id="terminal" class="terminal-logs">Tizim tayyor. Bot yaratish uchun so'rov yuboring...</div>
        </div>
    </div>

    <script>
        async function generateBot() {
            const prompt = document.getElementById('bot-prompt').value;
            const token = document.getElementById('bot-token').value;
            const editor = document.getElementById('editor');
            const terminal = document.getElementById('terminal');

            if(!prompt || !token) {
                alert("Iltimos, Bot Token va Bot vazifasini kiriting!");
                return;
            }

            terminal.innerText = "⏳ AI Bot kodi generatsiya qilinmoqda...\nFayllar va struktura tuzilmoqda...";
            
            try {
                const response = await fetch('/generate-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, token })
                });
                const data = await response.json();

                if(data.error) {
                    terminal.innerText = "❌ Xatolik: " + data.error;
                } else {
                    editor.value = data.code;
                    terminal.innerText = "✅ Bot kodi muvaffaqiyatli yaratildi!\n'▶️ Botni Ishga Tushirish' tugmasini bosing.";
                }
            } catch(err) {
                terminal.innerText = "❌ Server bilan bog'lanishda xatolik yuz berdi.";
            }
        }

        async function runCode() {
            const code = document.getElementById('editor').value;
            const terminal = document.getElementById('terminal');
            const status = document.getElementById('status');

            terminal.innerText = "🚀 Bot serverda ishga tushirilmoqda...";
            status.innerText = "RUNNING";
            status.style.color = "#f59e0b";

            try {
                const response = await fetch('/run-python', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await response.json();

                if(data.error) {
                    terminal.innerText = "❌ Xatolik:\n" + data.error;
                    status.innerText = "ERROR";
                    status.style.color = "#ef4444";
                } else {
                    terminal.innerText = "✅ OUTPUT:\n" + (data.output || "Bot fonda to'xtovsiz ishlamoqda...");
                    status.innerText = "ONLINE";
                    status.style.color = "#10b981";
                }
            } catch(err) {
                terminal.innerText = "❌ Aloqa uzildi!";
            }
        }
    </script>
</body>
</html>
