<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>OmniSphere - Global API & Bot Platform</title>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf855; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .box { margin-bottom: 20px; }
        label { display: block; color: #94a3b8; margin-bottom: 8px; }
        input, select { width: 100%; background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        button { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        .output { background: #020617; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; color: #38bdf8; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>OmniSphere Cloud & API Gateway</h1>
    
    <div class="box">
        <h3>1. Tarifni Tanlash va API Key Olish</h3>
        <label>Ismingiz / Kompaniya:</label>
        <input type="text" id="username" placeholder="Azizbek">
        
        <label>Tarifni Tanlang:</label>
        <select id="tier">
            <option value="starter">Starter Tarif ($5/oy) — 25 ta Bot + REST API</option>
            <option value="pro">Pro Tarif ($30/oy) — 65 ta Bot + AI Bot Builder (15 ta)</option>
            <option value="enterprise">Enterprise Tarif ($49/oy) — 230 ta Bot + Super AI (115 ta)</option>
        </select>
        <button onclick="registerKey()">API Key Generatsiya Qilish</button>
    </div>

    <div class="box">
        <h3>2. Telegram Bot Yaratish (Sizning API Keyingiz bilan)</h3>
        <label>Sizning API Key:</label>
        <input type="text" id="apiKeyInput" placeholder="omni_live_...">
        
        <label>Telegram Bot Token (@BotFather):</label>
        <input type="text" id="botTokenInput" placeholder="123456789:ABCdef...">
        
        <label>Bot Turi:</label>
        <select id="botType">
            <option value="ai_chat">AI Chat & Rasm Boti</option>
            <option value="ecommerce">E-Commerce Do'kon Boti</option>
            <option value="multitool">Universal 25+ Funksiyali Bot</option>
        </select>
        <button onclick="generateBot()">Botni Ishga Tushirish</button>
    </div>

    <div class="output" id="outputLog">> Tizim tayyor. API key va bot yaratish uchun yuqoridagi ma'lumotlarni kiriting...</div>
</div>

<script>
    async function registerKey() {
        const username = document.getElementById("username").value;
        const tier = document.getElementById("tier").value;
        
        const response = await fetch('http://localhost:8000/api/v1/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, tier})
        });
        const data = await response.json();
        
        if(data.status === 'success') {
            document.getElementById("apiKeyInput").value = data.api_key;
            document.getElementById("outputLog").innerText = JSON.stringify(data, null, 2);
        } else {
            alert("Xatolik yuz berdi!");
        }
    }

    async function generateBot() {
        const api_key = document.getElementById("apiKeyInput").value;
        const bot_token = document.getElementById("botTokenInput").value;
        const bot_type = document.getElementById("botType").value;
        
        const response = await fetch('http://localhost:8000/api/v1/generate-bot', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({api_key, bot_token, bot_type})
        });
        const data = await response.json();
        document.getElementById("outputLog").innerText = JSON.stringify(data, null, 2);
    }
</script>

</body>
</html>
