<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Replit — Online Code Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Monaco, 'Courier New', monospace;
        }

        body {
            background-color: #0e1117;
            color: #ecf2f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Navigation */
        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
        }

        .logo span {
            background-color: #1f6feb;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .btn-clear {
            background-color: #da3633;
        }

        .btn-clear:hover {
            background-color: #b62324;
        }

        /* Editor Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .editor-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
        }

        .tabs {
            background-color: #161b22;
            display: flex;
            border-bottom: 1px solid #30363d;
        }

        .tab {
            padding: 10px 20px;
            background: #0e1117;
            color: #8b949e;
            border: none;
            border-right: 1px solid #30363d;
            cursor: pointer;
            font-weight: 600;
        }

        .tab.active {
            background: #161b22;
            color: #58a6ff;
            border-bottom: 2px solid #58a6ff;
        }

        .code-area {
            flex: 1;
            background-color: #0d1117;
            color: #e6edf3;
            border: none;
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
            outline: none;
            resize: none;
            width: 100%;
            height: 100%;
        }

        .preview-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .preview-header {
            background-color: #161b22;
            color: #8b949e;
            padding: 8px 15px;
            font-size: 12px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            ⚡️ Mini Replit <span>IDE v1.0</span>
        </div>
        <div class="actions">
            <button class="btn btn-clear" onclick="clearCode()">🗑 Tozalash</button>
            <button class="btn" onclick="runCode()">▶️ Run (Kodni Ishga Tushirish)</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Editor Section -->
        <div class="editor-container">
            <div class="tabs">
                <button class="tab active" onclick="openTab('html')">index.html</button>
                <button class="tab" onclick="openTab('css')">style.css</button>
                <button class="tab" onclick="openTab('js')">script.js</button>
            </div>
            
            <textarea id="html-code" class="code-area" placeholder="HTML kodni shu yerga yozing..."><!-- Mini Replit Sandbox -->
<div class="box">
  <h1>Salom, Dunyo! 🚀</h1>
  <p>Bu sizning shaxsiy Mini Replit kodingiz!</p>
  <button onclick="showMessage()">Meni Bos</button>
</div></textarea>

            <textarea id="css-code" class="code-area" style="display:none;" placeholder="CSS kodni shu yerga yozing...">body {
  font-family: sans-serif;
  background-color: #f0f4f8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  text-align: center;
}
h1 { color: #0066cc; }
button {
  background: #28a745;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 15px;
}</textarea>

            <textarea id="js-code" class="code-area" style="display:none;" placeholder="JavaScript kodni shu yerga yozing...">function showMessage() {
  alert("Mini Replit Web-IDE muvaffaqiyatli ishlamoqda!");
}</textarea>
        </div>

        <!-- Preview Section -->
        <div class="preview-container">
            <div class="preview-header">
                <span>🖥 JONLI NATIJA (LIVE PREVIEW)</span>
                <span>STATUS: OK</span>
            </div>
            <iframe id="preview-window"></iframe>
        </div>
    </div>

    <script>
        function openTab(tabName) {
            const htmlTab = id('html-code');
            const cssTab = id('css-code');
            const jsTab = id('js-code');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            htmlTab.style.display = 'none';
            cssTab.style.display = 'none';
            jsTab.style.display = 'none';

            if(tabName === 'html') {
                htmlTab.style.display = 'block';
                tabs[0].classList.add('active');
            } else if(tabName === 'css') {
                cssTab.style.display = 'block';
                tabs[1].classList.add('active');
            } else if(tabName === 'js') {
                jsTab.style.display = 'block';
                tabs[2].classList.add('active');
            }
        }

        function runCode() {
            const html = id('html-code').value;
            const css = "<style>" + id('css-code').value + "</style>";
            const js = "<script>" + id('js-code').value + "<\/script>";

            const iframe = id('preview-window').contentWindow.document;
            iframe.open();
            iframe.write(html + css + js);
            iframe.close();
        }

        function clearCode() {
            id('html-code').value = '';
            id('css-code').value = '';
            id('js-code').value = '';
            runCode();
        }

        function id(name) {
            return document.getElementById(name);
        }

        // Avtomatik birinchi marta kodni yurgizish
        window.onload = runCode;
    </script>
</body>
</html>
