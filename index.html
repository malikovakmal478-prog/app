<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bot & Mini App Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-xl mt-6 border">
        
        <!-- Google Login Bo'limi -->
        <div class="flex items-center justify-between border-b pb-4 mb-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-robot text-red-500 text-2xl"></i>
                <h2 class="text-xl font-bold">BotStudio SaaS</h2>
            </div>
            <div id="g_id_onload"
                 data-client_id="1083921029301-example.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" id="google-btn"></div>
            <div id="user-info" class="hidden text-xs font-bold text-green-600"></div>
        </div>

        <p class="text-xs text-gray-500 text-center mb-6">Bot Token va g'oyangizni kiriting — AI unga alohida Mini App yaratib, bazaga saqlaydi va ishga tushiradi.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase mb-1 text-gray-700">Telegram Bot Token:</label>
                <input type="text" id="bot-token" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-red-400 text-sm" placeholder="123456789:ABCdefGhIJKlmNo...">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase mb-1 text-gray-700">Bot G'oyasi:</label>
                <textarea id="bot-prompt" rows="3" class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-red-400 text-sm" placeholder="Masalan: Tik-Tok uslubidagi videolar bor Mini App bot yaratib ber..."></textarea>
            </div>

            <button onclick="deployBot()" id="deploy-btn" class="w-full bg-red-500 text-white font-bold py-3 rounded-xl hover:bg-red-600 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rocket"></i> Botni Yaratish va Ishga Tushirish
            </button>
        </div>

        <div id="status-box" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
    </div>

    <script>
        let currentUserEmail = "anonymous";

        function handleCredentialResponse(response) {
            const responsePayload = JSON.parse(atob(response.credential.split('.')[1]));
            currentUserEmail = responsePayload.email;
            document.getElementById('google-btn').classList.add('hidden');
            const userInfo = document.getElementById('user-info');
            userInfo.classList.remove('hidden');
            userInfo.innerText = "✓ " + currentUserEmail;
        }

        async function deployBot() {
            const token = document.getElementById('bot-token').value.trim();
            const prompt = document.getElementById('bot-prompt').value.trim();
            const statusBox = document.getElementById('status-box');

            if (!token || !prompt) {
                alert("Iltimos, Bot Token va Promptni kiriting!");
                return;
            }

            statusBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-blue-100 text-blue-700";
            statusBox.classList.remove('hidden');
            statusBox.innerText = "AI shaxsiy Mini App kodingizni yaratmoqda va bazaga saqlamoqda...";

            try {
                const res = await fetch('https://mini-replit.onrender.com/deploy-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, prompt, email: currentUserEmail })
                });

                const data = await res.json();

                if (data.error) {
                    statusBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-red-100 text-red-700";
                    statusBox.innerText = "Xatolik: " + data.error;
                } else {
                    statusBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-green-100 text-green-700";
                    statusBox.innerHTML = `🚀 Bot ishga tushdi!<br><small>Mini App manzili: ${data.app_url}</small>`;
                }
            } catch (err) {
                statusBox.className = "mt-4 p-3 rounded-xl text-center text-sm font-medium bg-red-100 text-red-700";
                statusBox.innerText = "Server bilan bog'lanishda xatolik yuz berdi.";
            }
        }
    </script>
</body>
</html>
