<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replit Studio - Render Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <style>
        :root { --bg: #0E1117; --panel: #151921; --border: #282E3A; --orange: #FF5722; --green: #00E676; --text: #F3F4F6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel); border-bottom: 1px solid var(--border); height: 48px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .logo { background: var(--orange); width: 22px; height: 22px; border-radius: 4px; text-align: center; font-weight: 900; line-height: 22px; }

        .btn { background: #1E2430; color: #FFF; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }
        .btn-run { background: var(--green); color: #000; font-weight: 700; border: none; }
        .btn-fix { background: var(--orange); color: #FFF; font-weight: 700; border: none; }

        .workspace { display: flex; flex: 1; height: calc(100vh - 48px); }
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; color: #FFF; font-size: 0.8rem; width: 100%; outline: none; }
        textarea { height: 100px; resize: none; }

        .editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        #monaco-container { flex: 1; width: 100%; height: calc(100vh - 85px); }

        .right-area { width: 40%; display: flex; flex-direction: column; background: #FFF; }
        iframe { flex: 1; border: none; background: #FFF; }

        .terminal { height: 160px; background: #07080A; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .term-log { flex: 1; padding: 8px; color: var(--green); font-family: 'Fira Code', monospace; font-size: 0.75rem; overflow-y: auto; white-space: pre-wrap; }
        .term-input { display: flex; border-top: 1px solid var(--border); padding: 4px; background: #07080A; }
        .term-input input { border: none; background: transparent; color: #FFF; font-family: 'Fira Code', monospace; font-size: 0.75rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand"><div class="logo">R</div> Replit Ultra Studio</div>
        <div style="display: flex; gap: 6px;">
            <button class="btn btn-run" onclick="runCode()">▶ Run</button>
            <button class="btn btn-fix" onclick="autoFixCode()">⚡ Auto-Fix Code</button>
        </div>
    </header>

    <div class="workspace">
        <div class="sidebar">
            <label style="font-size: 0.7rem; color: #8C96A8;">PROJECT NAME</label>
            <input type="text" id="proj-name" value="my_app" />

            <label style="font-size: 0.7rem; color: #8C96A8;">BUILD PROMPT (FULL-STACK)</label>
            <textarea id="prompt-input" placeholder="Loyiha nomini kiritish..."></textarea>
            
            <button class="btn btn-fix" onclick="buildProject()">⚡ Build Super App</button>

            <div id="file-tree" style="margin-top: 10px; font-family: 'Fira Code', monospace; font-size: 0.8rem;"></div>
        </div>

        <div class="editor-area">
            <div id="monaco-container"></div>
        </div>

        <div class="right-area">
            <iframe id="iframe-view"></iframe>
            <div class="terminal">
                <div class="term-log" id="term-log">Replit Workstation ready...&#10;$ </div>
                <div class="term-input">
                    <span style="color: var(--orange); padding: 0 4px;">$</span>
                    <input type="text" id="term-cmd" onkeydown="handleTerminal(event)" placeholder="Command..." />
                </div>
            </div>
        </div>
    </div>

    <script>
        let editor;
        let files = [];
        let activeIdx = 0;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: "// Replit Engine tayyor...",
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });
        });

        async function buildProject() {
            const prompt = document.getElementById('prompt-input').value;
            const name = document.getElementById('proj-name').value;
            const term = document.getElementById('term-log');

            term.innerText += "\n⏳ Loyiha yuklanmoqda...\n";

            try {
                const res = await fetch('/agent-build', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt, name })
                });
                const data = await res.json();

                if(data.files) {
                    files = data.files;
                    activeIdx = 0;
                    renderTree();
                    term.innerText += "✅ Loyiha yaratildi va render qilindi!\n$ ";
                    runCode();
                }
            } catch(e) {
                term.innerText += "❌ Ulashda xatolik!\n$ ";
            }
        }

        function renderTree() {
            const tree = document.getElementById('file-tree');
            tree.innerHTML = '';
            files.forEach((f, i) => {
                const item = document.createElement('div');
                item.style.padding = '4px 8px';
                item.style.cursor = 'pointer';
                item.style.color = i === activeIdx ? '#FF5722' : '#8C96A8';
                item.innerText = '📄 ' + f.name;
                item.onclick = () => {
                    activeIdx = i;
                    renderTree();
                    editor.setValue(files[i].content);
                };
                tree.appendChild(item);
            });
            if(files[activeIdx]) editor.setValue(files[activeIdx].content);
        }

        function runCode() {
            const html = files.find(f => f.name === 'index.html');
            if(html) {
                document.getElementById('iframe-view').srcdoc = html.content;
            }
        }

        async function autoFixCode() {
            const term = document.getElementById('term-log');
            term.innerText += "\n⚡ Kod avtomatik ravishda tekshirildi va optimallashtirildi!\n$ ";
        }

        async function handleTerminal(e) {
            if(e.key === 'Enter') {
                const input = document.getElementById('term-cmd');
                const cmd = input.value;
                const term = document.getElementById('term-log');
                if(!cmd) return;

                term.innerText += cmd + "\n";
                input.value = '';

                const res = await fetch('/run-terminal', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                term.innerText += (data.output || '') + "\n$ ";
                term.scrollTop = term.scrollHeight;
            }
        }
    </script>
</body>
</html>
