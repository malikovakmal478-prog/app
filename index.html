<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Replit – AI Powered Cloud Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0D0E11;
            --panel: #15181E;
            --border: #262B35;
            --accent: #FF5733;
            --text: #F3F4F6;
            --text-dim: #9CA3AF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; color: var(--accent); }
        .logo span { background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; }
        
        .main-layout { display: flex; flex: 1; height: calc(100vh - 57px); }

        /* Left Sidebar: Controls & Files */
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        input, select, textarea { background: #090A0C; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--text); font-size: 0.85rem; outline: none; }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; min-height: 80px; }

        .btn-build { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-build:hover { opacity: 0.9; }

        .file-tree { margin-top: 10px; }
        .file-item { padding: 8px 12px; border-radius: 4px; font-size: 0.85rem; font-family: 'Fira Code', monospace; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .file-item:hover, .file-item.active { background: #212631; color: var(--accent); }

        /* Center IDE Editor */
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .tab-bar { background: #111318; border-bottom: 1px solid var(--border); display: flex; padding: 0 8px; }
        .tab { padding: 10px 16px; font-size: 0.8rem; font-family: 'Fira Code', monospace; border-right: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }
        .tab.active { background: var(--panel); color: var(--text); border-top: 2px solid var(--accent); }
        
        .code-editor { flex: 1; background: #0D0E11; border: none; padding: 16px; color: #E5E7EB; font-family: 'Fira Code', monospace; font-size: 0.9rem; line-height: 1.5; resize: none; outline: none; }

        /* Right Preview & Terminal */
        .preview-container { width: 45%; display: flex; flex-direction: column; background: #fff; }
        .preview-header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; color: var(--text); font-size: 0.8rem; }
        iframe { flex: 1; border: none; background: #ffffff; }
        .terminal { height: 180px; background: #050506; border-top: 1px solid var(--border); color: #10B981; padding: 12px; font-family: 'Fira Code', monospace; font-size: 0.8rem; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>⚡</span> SUPER REPLIT AI IDE</div>
        <button class="btn-build" style="padding: 6px 14px; font-size: 0.8rem;" onclick="exportZip()">📦 Export ZIP</button>
    </header>

    <div class="main-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="input-group">
                <label>Loyiha Turi</label>
                <select id="project-type">
                    <option value="web">🌐 Full-Stack Web App (HTML/CSS/JS)</option>
                    <option value="bot">🤖 Telegram Bot (Python 24/7)</option>
                    <option value="python">🐍 Python Script / Data App</option>
                </select>
            </div>

            <div class="input-group">
                <label>Telegram Bot Token (agar bot bo'lsa)</label>
                <input type="text" id="bot-token" placeholder="123456:ABC..." />
            </div>

            <div class="input-group">
                <label>AI Prompter / Topshiriq</label>
                <textarea id="prompt" placeholder="Masalan: Interaktiv Portfolio sayti yarat yoki Ob-havo ko'rsatuvchi bot tuz..."></textarea>
            </div>

            <button class="btn-build" id="build-btn" onclick="generateProject()">⚡ Loyihani Generatsiya Qilish</button>

            <div class="input-group">
                <label>Loyiha Fayllari</label>
                <div class="file-tree" id="file-tree">
                    <div style="font-size: 0.8rem; color: var(--text-dim);">Fayllar hali yaratilmadi.</div>
                </div>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-container">
            <div class="tab-bar" id="tab-bar">
                <div class="tab active">main.file</div>
            </div>
            <textarea class="code-editor" id="code-editor" spellcheck="false" placeholder="// Kodi shu yerda ko'rinadi..."></textarea>
        </div>

        <!-- Preview / Terminal -->
        <div class="preview-container">
            <div class="preview-header">
                <span>🖥 Live Preview / App Display</span>
                <span id="status" style="color: #10B981;">Ready</span>
            </div>
            <iframe id="web-preview"></iframe>
            <div class="terminal" id="terminal">System Logs & Terminal initialized...</div>
        </div>
    </div>

    <script>
        let currentFiles = [];
        let activeFileIndex = 0;

        async function generateProject() {
            const type = document.getElementById('project-type').value;
            const token = document.getElementById('bot-token').value;
            const prompt = document.getElementById('prompt').value;
            const terminal = document.getElementById('terminal');
            const status = document.getElementById('status');

            if(!prompt) { alert("Topshiriq matnini kiriting!"); return; }

            terminal.innerText = "⏳ AI arxitektura tuzmoqda va loyiha fayllarini yaratmoqda...\n";
            status.innerText = "Building...";
            status.style.color = "#F59E0B";

            try {
                const res = await fetch('/generate-project', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt, type, token })
                });
                const data = await res.json();

                if(data.error) {
                    terminal.innerText += "❌ Xatolik: " + data.error;
                    status.innerText = "Error";
                    status.style.color = "#EF4444";
                } else {
                    currentFiles = data.files || [];
                    renderFiles();
                    terminal.innerText += "✅ " + (data.logs || "Loyiha yaratildi!") + "\n";
                    status.innerText = "Running";
                    status.style.color = "#10B981";

                    // Live Web Preview ko'rsatish
                    updateWebPreview();

                    // Python Bot bo'lsa fonda ishlatish
                    const pyFile = currentFiles.find(f => f.name.endsWith('.py'));
                    if(pyFile) {
                        runPythonCode(pyFile.content);
                    }
                }
            } catch(e) {
                terminal.innerText += "❌ Ulanishda xatolik!";
            }
        }

        function renderFiles() {
            const tree = document.getElementById('file-tree');
            const tabBar = document.getElementById('tab-bar');
            tree.innerHTML = '';
            tabBar.innerHTML = '';

            currentFiles.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = `file-item ${index === activeFileIndex ? 'active' : ''}`;
                div.innerText = '📄 ' + file.name;
                div.onclick = () => switchFile(index);
                tree.appendChild(div);

                if(index === activeFileIndex) {
                    const tab = document.createElement('div');
                    tab.className = 'tab active';
                    tab.innerText = file.name;
                    tabBar.appendChild(tab);
                }
            });

            if(currentFiles[activeFileIndex]) {
                document.getElementById('code-editor').value = currentFiles[activeFileIndex].content;
            }
        }

        function switchFile(index) {
            if(currentFiles[activeFileIndex]) {
                currentFiles[activeFileIndex].content = document.getElementById('code-editor').value;
            }
            activeFileIndex = index;
            renderFiles();
        }

        function updateWebPreview() {
            const htmlFile = currentFiles.find(f => f.name === 'index.html');
            const cssFile = currentFiles.find(f => f.name === 'style.css');
            const jsFile = currentFiles.find(f => f.name === 'script.js');

            if(htmlFile) {
                let content = htmlFile.content;
                if(cssFile) content = content.replace('</head>', `<style>${cssFile.content}</style></head>`);
                if(jsFile) content = content.replace('</body>', `<script>${jsFile.content}<\/script></body>`);
                
                const iframe = document.getElementById('web-preview');
                iframe.srcdoc = content;
            }
        }

        async function runPythonCode(code) {
            const terminal = document.getElementById('terminal');
            terminal.innerText += "🚀 Python kodi ishga tushirilmoqda...\n";
            const res = await fetch('/run-python', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            terminal.innerText += (data.output || data.error) + "\n";
        }

        function exportZip() {
            if(currentFiles.length === 0) return alert("Eksport qilish uchun loyiha mavjud emas!");
            const zip = new JSZip();
            currentFiles.forEach(f => zip.file(f.name, f.content));
            zip.generateAsync({type:"blob"}).then(function(content) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "project.zip";
                a.click();
            });
        }
    </script>
</body>
</html>
