<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Mening Mini Replit Tizimim</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #1c1c1c; color: white; }
        #main { display: flex; flex: 1; }
        #code-input { width: 50%; height: 90vh; background: #252526; color: #d4d4d4; font-family: monospace; font-size: 14px; border: none; padding: 15px; resize: none; outline: none; }
        #output-container { width: 50%; padding: 15px; background: #121212; border-left: 1px solid #333; }
        button { padding: 10px 20px; font-size: 16px; background: #22c55e; border: none; color: white; cursor: pointer; font-weight: bold; margin: 10px; border-radius: 5px; }
        button:hover { background: #16a34a; }
        pre { color: #00ff00; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div style="background: #2d2d2d;">
        <button onclick="runCode()">► Botni 24/7 ishga tushirish (Run)</button>
    </div>

    <div id="main">
        <textarea id="code-input" placeholder="Botingiz kodini shu yerga joylang...">import telebot

BOT_TOKEN = 'TOKEN_YAZING'
bot = telebot.TeleBot(BOT_TOKEN)

@bot.message_handler(commands=['start'])
def start(message):
    bot.reply_to(message, 'Salom! Men 24/7 ishlayotgan botman!')

print('Bot ishga tushdi...')
bot.infinity_polling()</textarea>

        <div id="output-container">
            <h3>Natija (Console Output):</h3>
            <pre id="output">Kod joylang va Run tugmasini bosing...</pre>
        </div>
    </div>

    <script>
        async function runCode() {
            const userCode = document.getElementById('code-input').value;
            const outputElement = document.getElementById('output');
            outputElement.innerText = "Bot serverga yuborilmoqda va 24/7 ishga tushirilmoqda...";

            try {
                const response = await fetch('https://mini-replit.onrender.com/run-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: userCode })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    outputElement.innerText = "✅ " + result.message;
                } else {
                    outputElement.innerText = "❌ Xatolik: " + result.message;
                }
            } catch (error) {
                outputElement.innerText = "Xatolik yuz berdi: " + error.message;
            }
        }
    </script>
</body>
</html>
