<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replit IDE Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-dark: #0e1117;
            --sidebar-bg: #151921;
            --border-color: #2b3245;
            --accent-orange: #f26207;
            --accent-green: #00d67d;
            --text-main: #f3f4f6;
            --text-muted: #8c96a8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Replit Header */
        header { height: 44px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; }
        .logo-box { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; }
        .replit-logo { width: 20px; height: 20px; background: var(--accent-orange); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; }

        .run-btn { background: var(--accent-green); color: #000; border: none; padding: 5px 16px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .run-btn:hover { opacity: 0.9; }

        /* Replit Workspace Layout */
        .workspace { flex: 1; display: flex; height: calc(100vh - 44px); }

        /* Left File Explorer Panel */
        .sidebar { width: 240px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-title { padding: 10px 12px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        .file-list { flex: 1; padding: 8px; list-style: none; font-family: 'Fira Code', monospace; font-size: 0.8rem; }
        .file-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .file-item:hover, .file-item.active { background: #1e2430; color: #fff; }

        /* Agent Prompt Panel */
        .prompt-box { padding: 10px; border-top: 1px solid var(--border-color); background: var(--sidebar-bg); }
        .prompt-box input, .prompt-box textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; padding: 6px; font-size: 0.75rem; margin-bottom: 6px; outline: none; }
        .prompt-box textarea { height: 60px; resize: none; }
        .build-btn { width: 100%; background: var(--accent-orange); color: #fff; border: none; padding: 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

        /* Middle Editor Section */
        .editor-section { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
        .tabs-header { height: 35px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; }
        .tab { padding: 0 14px; height: 100%; display: flex; align-items: center; border-right: 1px solid var(--border-color); font-size: 0.8rem; font-family: 'Fira Code', monospace; color: var(--text-muted); cursor: pointer; background: var(--sidebar-bg); }
        .tab.active { background: var(--bg-dark); color: #fff; border-top: 2px solid var(--accent-orange); }

        #editor-container { flex: 1; width: 100%; }

        /* Right Panel: Webview Preview & Console Terminal */
        .right-section { width: 45%; display: flex; flex-direction: column; background: #fff; }
        .preview-header { height: 35px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 10px; font-size: 0.75rem; color: var(--text-muted); }
        iframe { flex: 1; border: none; width: 100%; background: #fff; }

        .terminal-box { height: 180px; background: #05070a; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; font-family: 'Fira Code', monospace; }
        .term-header { padding: 4px 10px; font-size: 0.7rem; color: var(--text-muted); background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); }
        .term-logs { flex: 1; padding: 8px; color: var(--accent-green); font-size: 0.75rem; overflow-y: auto; white-space: pre-wrap; }
        .term-input-line { display: flex; padding: 4px 8px; background: #05070a; border-top: 1px solid var(--border-color); }
        .term-input-line span { color: var(--accent-orange); font-size: 0.75rem; margin-right: 6px; }
        .term-input-line input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.75rem; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <div class="replit-logo">R</div>
            <span>Replit Workspace</span>
        </div>
        <button class="run-btn" onclick="runApp()">▶ Run</button>
    </header>

    <div class="workspace">
        <!-- Sidebar Explorer -->
        <div class="sidebar">
            <div class="sidebar-title">Files</div>
            <div class="file-list" id="file-list"></div>

            <div class="prompt-box">
                <input type="text" id="proj-name" value="my_app" />
                <textarea id="prompt-text" placeholder="Prompt kiriting..."></textarea>
                <button class="build-btn" onclick="buildApp()">⚡ Agent Build</button>
            </div>
        </div>

        <!-- Code Editor -->
        <div class="editor-section">
            <div class="tabs-header" id="tabs-header"></div>
            <div id="editor-container"></div>
        </div>

        <!-- Webview Preview & Terminal -->
        <div class="right-section">
            <div class="preview-header">WebView Preview</div>
            <iframe id="preview-iframe"></iframe>

            <div class="terminal-box">
                <div class="term-header">Console Terminal</div>
                <div class="term-logs" id="term-logs">Replit environment loaded successfully.&#10;$ </div>
                <div class="term-input-line">
                    <span>$</span>
                    <input type="text" id="term-input" onkeydown="execCmd(event)" placeholder="Type bash command..." />
                </div>
            </div>
        </div>
    </div>

    <script>
        let editor;
        let projectFiles = [];
        let activeFileIndex = 0;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "// Replit Editor Ready",
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true
            });

            // Avtomatik birinchi yuklash
            buildApp();
        });

        async function buildApp() {
            const name = document.getElementById('proj-name').value;
            const term = document.getElementById('term-logs');
            term.innerText += "\n⏳ Agent proyektni yig'moqda...\n";

            try {
                const res = await fetch('/agent-build', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name })
                });
                const data = await res.json();
                if(data.files) {
                    projectFiles = data.files;
                    activeFileIndex = 0;
                    renderSidebar();
                    renderTabs();
                    openFile(0);
                    runApp();
                    term.innerText += "✅ Replit Agent loyihani muvaffaqiyatli qurdi!\n$ ";
                }
            } catch(e) {
                term.innerText += "❌ Server ulanishda xato!\n$ ";
            }
        }

        function renderSidebar() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            projectFiles.forEach((f, i) => {
                const item = document.createElement('div');
                item.className = `file-item ${i === activeFileIndex ? 'active' : ''}`;
                item.innerHTML = `📄 ${f.name}`;
                item.onclick = () => openFile(i);
                list.appendChild(item);
            });
        }

        function renderTabs() {
            const tabsHeader = document.getElementById('tabs-header');
            tabsHeader.innerHTML = '';
            projectFiles.forEach((f, i) => {
                const tab = document.createElement('div');
                tab.className = `tab ${i === activeFileIndex ? 'active' : ''}`;
                tab.innerText = f.name;
                tab.onclick = () => openFile(i);
                tabsHeader.appendChild(tab);
            });
        }

        function openFile(index) {
            activeFileIndex = index;
            renderSidebar();
            renderTabs();
            
            const file = projectFiles[index];
            const ext = file.name.split('.').pop();
            let lang = 'plaintext';
            if(ext === 'html') lang = 'html';
            if(ext === 'css') lang = 'css';
            if(ext === 'js') lang = 'javascript';

            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(file.content);
        }

        function runApp() {
            if(projectFiles.length > 0) {
                // Hozirgi muharrir matnini faylga saqlash
                projectFiles[activeFileIndex].content = editor.getValue();

                const htmlFile = projectFiles.find(f => f.name === 'index.html');
                const cssFile = projectFiles.find(f => f.name === 'style.css');
                const jsFile = projectFiles.find(f => f.name === 'script.js');

                if(htmlFile) {
                    let doc = htmlFile.content;
                    if(cssFile) doc = doc.replace('</head>', `<style>${cssFile.content}</style></head>`);
                    if(jsFile) doc = doc.replace('</body>', `<script>${jsFile.content}<\/script></body>`);
                    
                    document.getElementById('preview-iframe').srcdoc = doc;
                }
            }
        }

        async function execCmd(e) {
            if(e.key === 'Enter') {
                const input = document.getElementById('term-input');
                const cmd = input.value;
                const term = document.getElementById('term-logs');
                if(!cmd) return;

                term.innerText += cmd + "\n";
                input.value = '';

                const res = await fetch('/run-terminal', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                term.innerText += (data.output || '') + "\n$ ";
                term.scrollTop = term.scrollHeight;
            }
        }
    </script>
</body>
</html>
